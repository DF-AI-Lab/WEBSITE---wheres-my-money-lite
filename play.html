<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play · Where's My Money? Lite</title>
<meta name="description" content="Where's My Money? Lite: see what's spare, payday to payday. No bank login, your money stays on your phone.">
<link rel="icon" href="lite-192.png">
<meta name="theme-color" content="#0f1513">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: three columns on desktop. Left = Scenarios (one-tap stories), middle = the working Lite app in a phone, right = Tips + explore progress.
   Under 1100px the phone stands alone and the two rails become one bottom sheet with tabs. Dark first, like Darren's phone. */
:root {
  --bg: #0f1513; --card: #171f1c; --text: #e9f0ed; --muted: #93a39d; --border: #26332f; --row: #1d2724;
  --accent: #3fd0a4; --on-accent: #06221b; --good: #3fd0a4; --bad: #f07a6a; --goodbg: rgba(63,208,164,.14); --badbg: rgba(240,122,106,.16);
  --bill: #7fb0ff; --on-bill: #071a33; --spend: #f2b632; --on-spend: #241a00; --pot: #f59a4a; --on-pot: #1f0e00; --spare: #3fd0a4; --ring-bg: #26332f;
  --zused: #e06cd8; --zfree: #6b5a9e; --zfreetext: #a99ad6; --on-z: #2a0627;
  --phone: #050807; --glow: rgba(63,208,164,.13); --tip: #e9f0ed; --on-tip: #0f1513; --shade: rgba(0,0,0,.5);
  --display: "Bricolage Grotesque", "Manrope", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f3f5f4; --card: #ffffff; --text: #14201c; --muted: #5d6b66; --border: #dde3e0; --row: #eef2f0;
  --accent: #0f6e5c; --on-accent: #ffffff; --good: #138a5e; --bad: #c8463a; --goodbg: rgba(19,138,94,.12); --badbg: rgba(200,70,58,.12);
  --bill: #2f6fd0; --on-bill: #ffffff; --spend: #b07d00; --on-spend: #ffffff; --pot: #e0701b; --on-pot: #1f0e00; --spare: #13a07a; --ring-bg: #dde3e0;
  --zused: #b53aab; --zfree: #c3b6ea; --zfreetext: #6b5a9e; --on-z: #ffffff;
  --phone: #14201c; --glow: rgba(15,110,92,.14); --tip: #14201c; --on-tip: #ffffff; --shade: rgba(20,32,28,.35);
  color-scheme: light } }
:root[data-theme="light"] {
  --bg: #f3f5f4; --card: #ffffff; --text: #14201c; --muted: #5d6b66; --border: #dde3e0; --row: #eef2f0;
  --accent: #0f6e5c; --on-accent: #ffffff; --good: #138a5e; --bad: #c8463a; --goodbg: rgba(19,138,94,.12); --badbg: rgba(200,70,58,.12);
  --bill: #2f6fd0; --on-bill: #ffffff; --spend: #b07d00; --on-spend: #ffffff; --pot: #e0701b; --on-pot: #1f0e00; --spare: #13a07a; --ring-bg: #dde3e0;
  --zused: #b53aab; --zfree: #c3b6ea; --zfreetext: #6b5a9e; --on-z: #ffffff;
  --phone: #14201c; --glow: rgba(15,110,92,.14); --tip: #14201c; --on-tip: #ffffff; --shade: rgba(20,32,28,.35);
  color-scheme: light }

* { box-sizing: border-box; }
html { overflow-x: clip; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--body); font-variant-numeric: tabular-nums; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; flex: none; }
.dot.bill { background: var(--bill); } .dot.pot { background: var(--pot); } .dot.spend { background: var(--spend); } .dot.spare { background: var(--spare); }
.dot.zused { background: var(--zused); } .dot.zfree { background: var(--zfree); } .dot.grey { background: var(--muted); }

/* page header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.top .in { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
.brand img { width: 32px; height: 32px; border-radius: 8px; }
.brand span { font: 800 20px var(--display); letter-spacing: -.01em; }
.reset { margin-left: auto; border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 8px 14px; font-weight: 800; display: flex; gap: 8px; align-items: center; }
.reset svg { transition: transform .5s var(--ease); }
.reset:hover svg { transform: rotate(-180deg); }

/* three columns */
.layout { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 404px minmax(0, 1fr); gap: 36px; align-items: start;
  padding: 28px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }
.rail { position: sticky; top: 84px; display: grid; gap: 14px; }
.rail h2 { font: 800 28px/1.05 var(--display); letter-spacing: -.02em; margin: 0; }
.rail .lead { color: var(--muted); margin: 0; font-size: 14px; }
.scn { display: grid; gap: 8px; }
.sc { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 38px 1fr; gap: 2px 12px; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--border);
  transition: transform .15s var(--ease), border-color .2s; }
.sc:hover { transform: translateX(3px); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.sc:active { transform: scale(.98); }
.sc:focus-visible { outline: 3px solid var(--accent); }
.sc .ic { grid-row: 1 / span 3; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; background: var(--row); }
.sc b { font-size: 15px; }
.sc small { color: var(--muted); font-size: 13px; }
.sc .res { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.sc.done { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
.sc.done .ic { background: var(--goodbg); }
.chg { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px; animation: inrow .4s var(--ease); }
.chg.up { background: var(--goodbg); color: var(--good); } .chg.down { background: var(--badbg); color: var(--bad); } .chg.same { background: var(--row); color: var(--muted); }

.tipbox { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.switch { display: flex; align-items: center; gap: 12px; font-weight: 800; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .tr { width: 46px; height: 28px; border-radius: 99px; background: var(--row); border: 1px solid var(--border); position: relative; transition: background .25s; flex: none; }
.switch .tr::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .3s var(--ease), background .25s; }
.switch input:checked + .tr { background: var(--accent); }
.switch input:checked + .tr::after { transform: translateX(18px); background: var(--on-accent); }
.switch input:focus-visible + .tr { outline: 3px solid var(--accent); outline-offset: 2px; }
.prog { display: grid; gap: 6px; }
.prog .pt { font-size: 14px; color: var(--muted); }
.prog .pt b { color: var(--text); }
.pbarx { height: 8px; border-radius: 99px; background: var(--row); overflow: hidden; position: relative; }
.pbarx i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--accent); transition: width .6s var(--ease); }
.tipbox.all .pbarx i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform: translateX(-100%); animation: shine 1.4s .2s var(--ease) 2; }
@keyframes shine { to { transform: translateX(100%); } }
.allmsg { font-weight: 800; color: var(--good); animation: inrow .5s var(--ease); }
.tlist { display: grid; gap: 4px; }
.tl { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; padding: 8px; border-radius: 10px; font-size: 13px; color: var(--muted); }
.tl:hover { background: var(--row); }
.tl:focus-visible { outline: 2px solid var(--accent); }
.tl .num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; border: 1.5px dashed var(--border); }
.tl.found { color: var(--text); }
.tl.found .num { background: var(--accent); color: var(--on-accent); border: 0; }
.tl b { display: block; font-size: 14px; }

/* phone */
.center { display: grid; justify-items: center; gap: 14px; position: relative; min-width: 0; }
.center::before { content: ""; position: absolute; top: 6%; width: 130%; max-width: 560px; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, var(--glow), transparent 66%); pointer-events: none; }
.phone { position: relative; width: 392px; max-width: 100%; background: var(--phone); border-radius: 52px; padding: 11px; box-shadow: 0 40px 80px rgba(0,0,0,.35), inset 0 0 0 1.5px rgba(255,255,255,.06); transition: box-shadow .6s; }
.phone.win { box-shadow: 0 40px 80px rgba(0,0,0,.35), 0 0 0 3px var(--accent), 0 0 60px var(--glow); }
.screen { position: relative; background: var(--bg); border-radius: 42px; overflow: hidden; height: min(780px, calc(100dvh - 130px)); min-height: 560px; display: flex; flex-direction: column; }
.island { height: 30px; display: grid; place-items: center; flex: none; }
.island i { width: 96px; height: 26px; border-radius: 99px; background: var(--phone); }
.scroll { position: relative; overflow-y: auto; overflow-x: hidden; flex: 1; padding: 4px 12px 24px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.pcap { font-size: 13px; color: var(--muted); text-align: center; position: relative; }

/* app header */
.ahead { display: flex; gap: 10px; align-items: flex-start; padding: 6px 2px 10px; }
.ahead img { width: 44px; height: 44px; border-radius: 11px; }
.ahead .nm { font: 800 19px/1.15 var(--body); letter-spacing: -.01em; }
.ahead .tg { font-size: 12px; font-weight: 700; color: var(--accent); }
.aside { margin-left: auto; display: grid; justify-items: end; gap: 6px; }
.setbtn { border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 6px 10px; font-size: 12px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
.vrow { display: flex; gap: 6px; align-items: center; }
.bell { position: relative; width: 30px; height: 28px; border: 1px solid var(--border); background: var(--card); border-radius: 9px; display: grid; place-items: center; color: var(--spend); }
.bell b { position: absolute; top: -7px; right: -7px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10px; line-height: 17px; text-align: center; }
.appver { font-size: 11px; color: var(--muted); }
.tab { display: flex; justify-content: center; border-top: 1px solid var(--border); margin: 0 2px 10px; position: relative; }
.tab button { margin-top: -1px; border: 1px solid var(--border); border-top: 0; background: var(--bg); border-radius: 0 0 10px 10px; padding: 1px 12px 3px; color: var(--muted); line-height: 0; }

/* cards */
.c { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
.lbl { font-size: 11px; font-weight: 800; letter-spacing: .07em; color: var(--muted); text-transform: uppercase; display: flex; align-items: center; gap: 4px; }
.info { all: unset; cursor: pointer; font-size: 13px; color: var(--muted); padding: 0 2px; letter-spacing: 0; text-transform: none; font-weight: 600; }
.info:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.sthead { display: flex; justify-content: space-between; gap: 10px; }
.bigwrap { position: relative; }
.big { font: 800 40px/1.05 var(--body); letter-spacing: -.02em; color: var(--accent); margin: 4px 0 6px; }
.big.low { color: var(--bad); }
.key { font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 6px; }
.key span { white-space: nowrap; display: inline-flex; align-items: center; }
.key .dot { width: 7px; height: 7px; margin-right: 4px; }
.ringwrap { position: relative; flex: none; }
.ring { width: 96px; height: 96px; display: block; }
.ring circle { fill: none; stroke-width: 10; transition: stroke-dasharray .9s var(--ease), stroke-dashoffset .9s var(--ease); }
.ring .bg { stroke: var(--ring-bg); } .ring .sb { stroke: var(--bill); } .ring .sp { stroke: var(--pot); } .ring .ss { stroke: var(--spend); } .ring .sf { stroke: var(--spare); }
.ring text { fill: var(--text); font: 800 19px var(--body); }
.strows { margin-top: 14px; font-size: 14px; }
.strows .r { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-top: 1px dashed var(--border); color: var(--muted); }
.strows .r > span:first-child { display: inline-flex; align-items: center; white-space: nowrap; }
.strows .v { color: var(--text); font-weight: 700; }
.strows .tot { color: var(--text); font-weight: 800; border-top: 0; }
.strows .line { border-top: 2px solid var(--text); padding: 0; margin-top: 6px; }
.k-bill { color: var(--bill) !important; } .k-spend { color: var(--spend) !important; } .k-pot { color: var(--pot) !important; } .k-bad { color: var(--bad) !important; }
.ulink { all: unset; cursor: pointer; color: var(--text); font-weight: 700; border-bottom: 2px dotted var(--muted); }
.ulink:focus-visible { outline: 2px solid var(--accent); }
.zc { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.zrow { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin-top: 8px; }
.zrow b { color: var(--text); margin-left: 10px; }
.zrow b.free { color: var(--zfreetext); }
.zc small { font-size: 11px; color: var(--muted); display: block; margin-top: 8px; }
.zring { width: 92px; height: 92px; flex: none; }
.zring circle { fill: none; stroke-width: 9; }
.zring .zf { stroke: var(--zfree); } .zring .zu { stroke: var(--zused); transition: stroke-dasharray .6s var(--ease); }
.zring text { fill: var(--text); font: 800 19px var(--body); } .zring text.s { font: 600 9px var(--body); fill: var(--muted); }

.fh { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; cursor: pointer; font: 800 18px var(--body); }
.fh:focus-visible { outline: 2px solid var(--accent); border-radius: 8px; }
.fh .chev { margin-left: auto; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); border: 1.5px solid transparent; transition: border-color .2s; flex: none; }
.c.open > .fh .chev { border-color: var(--text); color: var(--text); }
.fh .chev svg { transition: transform .3s var(--ease); }
.c.open > .fh .chev svg { transform: rotate(90deg); }
.c[data-k="spend"] > .fh { color: var(--spend); } .c[data-k="spend"] > .fh .dot { background: var(--spend); }
.c[data-k="pots"] > .fh { color: var(--pot); } .c[data-k="pots"] > .fh .dot { background: var(--pot); }
.c[data-k="card"] > .fh { color: var(--zused); } .c[data-k="card"] > .fh .dot { background: var(--zused); }
.c[data-k="bills"] > .fh { color: var(--bill); } .c[data-k="bills"] > .fh .dot { background: var(--bill); }
.c[data-k="last"] > .fh .dot, .c[data-k="cats"] > .fh .dot, .c[data-k="periods"] > .fh .dot { background: var(--muted); }
.fb { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); }
.c.open > .fb { grid-template-rows: 1fr; }
.fb > div { overflow: hidden; min-height: 0; }
.fb .in { padding-top: 12px; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }

.seg { display: inline-flex; background: var(--bg); border-radius: 99px; padding: 4px; border: 1px solid var(--border); }
.seg button { border: 0; background: none; border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 700; color: var(--muted); transition: background .25s, color .25s; }
.seg button.on { background: var(--spend); color: var(--on-spend); }
.seg.b button.on { background: var(--bill); color: var(--on-bill); }
.when { position: relative; display: inline-block; }
.addform { display: grid; grid-template-columns: 30% 1fr auto; gap: 8px; margin: 12px 0; }
.addform input { min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 11px 12px; font-size: 15px; }
.addform input::placeholder { color: var(--muted); opacity: .7; }
.addform button { border: 0; border-radius: 12px; padding: 0 16px; font-weight: 800; background: var(--spend); color: var(--on-spend); }
.addform button:active { transform: scale(.95); }
.addform.pot button { background: var(--pot); color: var(--on-pot); }
.addform.bill button { background: var(--accent); color: var(--on-accent); }
.addform.zz { grid-template-columns: 26% 1fr auto auto; }
.addform.zz button { background: var(--zused); color: var(--on-z); padding: 0 13px; }
.addform.zz button.off { background: var(--card); color: var(--text); border: 1px solid var(--border); font-size: 12px; padding: 0 9px; }
.addform.bad input { border-color: var(--bad); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.bar2 { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-weight: 700; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.row { position: relative; display: grid; grid-template-columns: 1fr auto 26px; gap: 0 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); animation: inrow .4s var(--ease); }
.row .n { font-weight: 800; font-size: 15px; }
.row .s { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.row .a { font-weight: 800; color: var(--spend); text-align: right; }
.row.up .n, .row.up .a { font-style: italic; }
.paidq { all: unset; cursor: pointer; display: block; font-size: 11px; font-weight: 800; color: var(--accent); text-align: right; }
.more { all: unset; cursor: pointer; color: var(--muted); font-weight: 800; letter-spacing: 1px; text-align: center; border-radius: 8px; padding: 4px 6px; }
.more:focus-visible { outline: 2px solid var(--accent); }
.more.box { background: var(--row); color: var(--text); }
.addcat { all: unset; cursor: pointer; color: var(--accent); font-weight: 800; border-bottom: 1.5px dashed var(--accent); }
.grp { font-size: 11px; font-weight: 800; color: var(--muted); padding: 10px 0 4px; letter-spacing: .05em; text-transform: uppercase; border-bottom: 1px solid var(--border); }
.sums { margin-top: 6px; padding-top: 6px; font-size: 14px; }
.sums div { display: flex; justify-content: space-between; padding: 4px 0; color: var(--muted); }
.sums b { color: var(--text); }
.sums .it { font-style: italic; }
.sums .tt { color: var(--text); font-weight: 800; }
.catv .cr { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; animation: inrow .35s var(--ease); }
.catv .cr small { color: var(--muted); }
.catv .cb { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--row); overflow: hidden; }
.catv .cb i { display: block; height: 100%; border-radius: 99px; transition: width .7s var(--ease); }
.note { font-size: 12px; color: var(--muted); margin-top: 6px; }

div.pot { position: relative; padding: 12px 0; border-bottom: 1px solid var(--border); }
.pot .ph { display: flex; align-items: center; gap: 8px; }
.pot .ph .l { margin-left: auto; color: var(--accent); font-weight: 800; }
.pot .ph .l.over { color: var(--bad); }
.pbar { height: 8px; background: var(--row); border-radius: 99px; margin: 8px 0 6px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--pot); border-radius: 99px; transition: width .8s var(--ease); }
.pot.over .pbar i { background: var(--bad); }
.pot small { color: var(--muted); font-size: 12px; }
.setamt { width: 86px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; margin-left: auto; }

.ccrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); animation: inrow .4s var(--ease); }
.ccrow .a { color: var(--zused); font-weight: 800; margin-left: auto; }
.ccrow.pay .a { color: var(--accent); }
.ccrow .x { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg); }

    $('ptext').innerHTML = `You've found <b>${found.size} of ${TIPS.length}</b> tips`;
    $('pbar').style.width = (100 * found.size / TIPS.length) + '%';
    $('tcnt').textContent = found.size + '/' + TIPS.length;
    const all = found.size === TIPS.length;
    $('allmsg').hidden = !all; $('tipbox').classList.toggle('all', all); $('phone').classList.toggle('win', all);
    $('tlist').querySelectorAll('.tl').forEach(b => b.onclick = () => { if (!tipOn) { $('tipmode').checked = true; setTipMode(true); } showTip(+b.dataset.ti); });
  }
  const tipTarget = i => document.querySelector(TIPS[i].q) || (TIPS[i].alt && document.querySelector(TIPS[i].alt));
  function placeHotspots() {
    document.querySelectorAll('.hs').forEach(h => h.remove());
    if (!tipOn) return;
    TIPS.forEach((t, i) => { const el = tipTarget(i); if (!el) return;
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.insertAdjacentHTML('beforeend', `<button type="button" class="hs${found.has(i) ? ' found' : ''}" data-act="hs" data-i="${i}" aria-label="Tip ${i + 1}: ${esc(t.t)}" style="animation-delay:${reduce ? 0 : i * 40}ms, ${1000 + i * 120}ms">${i + 1}</button>`); });
    if (curTip !== null) { const el = tipTarget(curTip); if (el) el.classList.add('hl'); }
  }
  function setTipMode(on) {
    tipOn = on;
    if (on) Object.keys(S.open).forEach(k => S.open[k] = k === 'card' || k === 'periods' ? S.open[k] : true);
    if (!on) hideTip();
    render();
    if (on && matchMedia('(max-width: 1099px)').matches) closeSheet();
  }
  function showTip(i) {
    hideTip(true); curTip = i;
    const el = tipTarget(i); if (!el) return;
    const sc = $('scroll'), y = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop;
    sc.scrollTo({ top: Math.max(y - 120, 0), behavior: reduce ? 'auto' : 'smooth' });
    el.classList.add('hl');
    const first = !found.has(i); found.add(i);
    const tc = $('tcard');
    tc.innerHTML = `<div class="k">Tip ${i + 1} of ${TIPS.length}${first ? ' · new' : ''}</div><h3>${esc(TIPS[i].t)}</h3><p>${esc(TIPS[i].p)}</p>
      <div class="tb"><button type="button" data-act="tipclose">Got it</button>${found.size < TIPS.length ? '<button type="button" class="go" data-act="tipnext">Next tip</button>' : ''}</div>`;
    tc.style.top = 'auto'; tc.style.bottom = '18px';
    setTimeout(() => { const er = el.getBoundingClientRect(), sr = $('screen').getBoundingClientRect();
      if (er.bottom > sr.bottom - 190) { tc.style.bottom = 'auto'; tc.style.top = '46px'; } tc.classList.add('on'); }, reduce ? 0 : 320);
    drawTipList();
    document.querySelectorAll(`.hs[data-i="${i}"]`).forEach(h => h.classList.add('found'));
  }
  function hideTip(keep) { $('tcard').classList.remove('on'); document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl')); if (!keep) curTip = null; }
  $('tipmode').onchange = e => setTipMode(e.target.checked);

  // ---------- floating ⓘ tips + toasts ----------
  const tipb = $('tipb'), screen = $('screen'); let tipOwner = null, toastT;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1900); }
  function showInfo(b) {
    if (tipOwner === b) { tipb.classList.remove('on'); tipOwner = null; return; }
    tipb.textContent = b.dataset.tip; tipOwner = b;
    const sr = screen.getBoundingClientRect(), br = b.getBoundingClientRect();
    tipb.style.left = Math.min(Math.max(br.left - sr.left - 110, 10), sr.width - 260) + 'px';
    tipb.style.top = (br.bottom - sr.top + 6) + 'px'; tipb.classList.add('on');
  }
  $('scroll').addEventListener('scroll', () => { if (tipOwner) { tipb.classList.remove('on'); tipOwner = null; } closeMenu(); }, { passive: true });

  // ---------- bill ⋯ menu ----------
  const menu = $('bmenu'); let menuBill = null;
  function openMenu(id, view, anchor) {
    const b = S.bills.find(x => x.id === id); if (!b) return; menuBill = b;
    const isPaid = b.paid || gone(b);
    const back = '<button type="button" class="back" data-act="mview" data-v="main">← Back</button>';
    const views = {
      main: `<div class="big2"><button type="button" data-act="mview" data-v="amount">Amount</button>${isPaid ? `<button type="button" data-act="bpaid">Not paid yet</button>` : `<button type="button" class="pri" data-act="bpaid">Mark paid</button>`}</div>
        <button type="button" class="mi" data-act="mview" data-v="name">Change name</button><button type="button" class="mi" data-act="mview" data-v="due">Due day</button>
        <button type="button" class="mi" data-act="mview" data-v="cat">Category</button><button type="button" class="mi" data-act="bcard">${b.paysCard ? 'Pays a credit card ✓' : 'Pays a credit card'}</button>
        <hr><div class="big2"><button type="button" data-act="bpause">${b.paused ? 'Resume' : 'Pause'}</button><button type="button" class="stop" data-act="mview" data-v="del">Delete</button></div>`,
      amount: `<div class="mh">New amount for ${esc(b.n)}</div><form class="mf" data-form="bamount"><input name="v" inputmode="decimal" value="${b.a.toFixed(2)}" aria-label="Amount"><button type="submit">Save</button></form>${back}`,
      name: `<div class="mh">Change name</div><form class="mf" data-form="bname"><input name="v" value="${esc(b.n)}" aria-label="Name"><button type="submit">Save</button></form>${back}`,
      due: `<div class="mh">Due day</div><div class="days">${Array.from({ length: 31 }, (_, i) => `<button type="button" data-act="bdue" data-v="${i + 1}" class="${b.d === i + 1 ? 'on' : ''}">${i + 1}</button>`).join('')}<button type="button" class="vary${b.d === 'varies' ? ' on' : ''}" data-act="bdue" data-v="varies">Varies</button></div>${back}`,
      cat: `<div class="mh">Category</div><div class="chips">${CATS.map(c => `<button type="button" class="chip" data-act="bcat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>${back}`,
      del: `<div class="mh">Delete ${esc(b.n)}? It leaves your bills for good.</div><div class="big2"><button type="button" data-act="mview" data-v="main">Cancel</button><button type="button" class="stop" data-act="bdel">Delete</button></div>`,
    };
    menu.innerHTML = views[view || 'main'];
    if (anchor) {
      const sr = screen.getBoundingClientRect(), ar = anchor.getBoundingClientRect();
      menu.style.left = Math.max(10, Math.min(ar.right - sr.left - 270, sr.width - 280)) + 'px';
      const below = ar.bottom - sr.top + 6;
      menu.style.top = (below + 330 > sr.height ? Math.max(40, ar.top - sr.top - 330) : below) + 'px';
    }
    menu.classList.add('on');
    const inp = menu.querySelector('input'); if (inp) setTimeout(() => { inp.focus({ preventScroll: true }); inp.select(); }, 60);
  }
  function closeMenu() { menu.classList.remove('on'); menuBill = null; }

  // ---------- one click handler for the whole page ----------
  document.addEventListener('click', e => {
    const info = e.target.closest('.info');
    if (info && screen.contains(info)) { showInfo(info); return; }
    if (tipOwner) { tipb.classList.remove('on'); tipOwner = null; }
    const a = e.target.closest('[data-act]');
    if (!a) { if (!e.target.closest('.menu')) closeMenu(); if (!e.target.closest('.tcard') && !e.target.closest('.tl')) hideTip(); return; }
    const act = a.dataset.act, id = +a.dataset.id;
    if (act !== 'mview' && !act.startsWith('b') && act !== 'bmenu') closeMenu();
    const sp = S.spends.find(s => s.id === id);
    switch (act) {
      case 'fold': S.open[a.dataset.k] = !S.open[a.dataset.k]; render(); break;
      case 'toast': toast(a.dataset.msg); break;
      case 'payday': openPayday(); break;
      case 'mode': S.mode = a.dataset.v; render(); break;
      case 'sview': S.spendView = a.dataset.v; render(); break;
      case 'bview': S.billView = a.dataset.v; render(); break;
      case 'spendpaid': sp.up = false; sp.when = '6 Nov 2024'; render(); toast('Marked as paid'); break;
      case 'spenddel': S.spends = S.spends.filter(s => s !== sp); render(); toast('Spend removed'); break;
      case 'spendcat': { const row = a.closest('.row'); if (row.querySelector('.chips')) { render(); break; }
        row.insertAdjacentHTML('beforeend', `<div class="chips" style="grid-column:1/-1;padding-top:8px">${CATS.slice(4).concat(S.pots.map(p => p.n)).filter((v, i, x) => x.indexOf(v) === i).map(c => `<button type="button" class="chip" data-act="setcat" data-id="${id}" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`); break; }
      case 'setcat': sp.cat = a.dataset.v; render(); break;
      case 'potdel': S.pots = S.pots.filter(p => p.n !== a.dataset.n); render(); break;
      case 'potset': { const inp = document.createElement('input'); inp.className = 'setamt'; inp.inputMode = 'decimal'; inp.placeholder = '100'; inp.setAttribute('aria-label', 'Monthly amount');
        a.replaceWith(inp); inp.focus(); const done = () => { const v = num(inp.value); const p = S.pots.find(x => x.n === a.dataset.n); if (p && v > 0) p.a = v; render(); };
        inp.onkeydown = ev => { if (ev.key === 'Enter') done(); if (ev.key === 'Escape') render(); }; inp.onblur = done; break; }
      case 'cardoff': cardAdd(-1); break;
      case 'carddel': S.card.splice(+a.dataset.i, 1); render(); break;
      case 'bmenu': openMenu(id, a.dataset.v, a); break;
      case 'mview': openMenu(menuBill.id, a.dataset.v); break;
      case 'bpaid': menuBill.paid = !(menuBill.paid || gone(menuBill)); if (!menuBill.paid && gone(menuBill)) menuBill.paid = false; closeMenu(); render(); toast(menuBill === null ? '' : 'Updated'); break;
      case 'bcard': menuBill.paysCard = !menuBill.paysCard; toast(menuBill.paysCard ? menuBill.n + ' pays the Zopa card' : 'No longer a card payment'); closeMenu(); break;
      case 'bpause': { const b = menuBill; b.paused = !b.paused; closeMenu(); render(); toast(b.paused ? b.n + ' paused: not counted' : b.n + ' counted again'); break; }
      case 'bdue': menuBill.d = a.dataset.v === 'varies' ? 'varies' : +a.dataset.v; closeMenu(); render(); break;
      case 'bcat': menuBill.cat = a.dataset.v; closeMenu(); render(); break;
      case 'bdel': { const n = menuBill.n; S.bills = S.bills.filter(b => b !== menuBill); closeMenu(); render(); toast(n + ' deleted'); break; }
      case 'resume': S.bills.find(b => b.id === id).paused = false; render(); break;
      case 'pausedfold': pausedOpen = !pausedOpen; render(); break;
      case 'lastopen': { const i = +a.dataset.i; openLast.has(i) ? openLast.delete(i) : openLast.add(i); a.closest('.lrow').classList.toggle('open'); a.setAttribute('aria-expanded', openLast.has(i)); break; }
      case 'catopen': { const k = a.dataset.k; openCat.has(k) ? openCat.delete(k) : openCat.add(k); a.closest('.crow').classList.toggle('open'); a.setAttribute('aria-expanded', openCat.has(k)); break; }
      case 'tobill': S.bills.push({ id: ++S.nid, n: a.dataset.n, d: null, cat: a.dataset.c, a: +a.dataset.a, avg: +a.dataset.a }); S.open.bills = true; render(); toast(a.dataset.n + ' added to Bills'); break;
      case 'hs': showTip(+a.dataset.i); break;
      case 'tipclose': hideTip(); break;
      case 'tipnext': { const nx = TIPS.findIndex((_, i) => !found.has(i)); if (nx >= 0) showTip(nx); break; }
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); hideTip(); closeSheet(); } });

  // forms inside the phone
  const bad = f => { f.classList.remove('bad'); void f.offsetWidth; f.classList.add('bad'); };
  function cardAdd(sign) { const f = document.querySelector('[data-form="card"]'), a = num(f.a.value), n = f.n.value.trim() || (sign < 0 ? 'Paid off' : '');
    if (!(a > 0) || !n) return bad(f); S.card.unshift({ n, a: sign * a, when: '6 Nov 2024' }); render(); }
  document.addEventListener('submit', e => {
    const f = e.target, kind = f.dataset.form; if (!kind) return; e.preventDefault();
    const a = f.a ? num(f.a.value) : NaN, n = f.n ? f.n.value.trim() : '', v = f.v ? f.v.value.trim() : '';
    if (kind === 'spend') { if (!(a > 0) || !n) return bad(f); S.spends.unshift({ id: ++S.nid, n, a, cat: guess(n), up: S.mode === 'up', when: '6 Nov 2024' }); render(); flashPart('#stcard'); }
    if (kind === 'pot') { if (!n || S.pots.some(p => p.n.toLowerCase() === n.toLowerCase())) return bad(f); S.pots.push({ n, a: a > 0 ? a : 0 }); if (!CATS.includes(n)) CATS.push(n); render(); }
    if (kind === 'card') cardAdd(1);
    if (kind === 'bill') { if (!(a > 0) || !n) return bad(f); S.bills.push({ id: ++S.nid, n, d: null, cat: '', a, avg: a }); render(); toast(n + ' added. Tap + date to set its day'); }
    if (kind === 'bamount') { const x = num(v); if (!(x >= 0)) return bad(f); menuBill.a = x; closeMenu(); render(); toast('Amount saved'); }
    if (kind === 'bname') { if (!v) return bad(f); menuBill.n = v; closeMenu(); render(); }
  });

  // ---------- new month ----------
  function newMonth() {
    const before = compute();
    S.left = Math.max(Math.round(before.actual * 100) / 100, 0);
    S.spends = S.spends.filter(s => s.up); S.bills.forEach(b => b.paid = false);
    $('flashamt').textContent = '+ ' + fmt(S.pay);
    const fl = $('flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
    $('scroll').scrollTo({ top: 0 });
    setTimeout(render, reduce ? 0 : 800);
  }
  function openPayday() { newMonth(); toast('New month started. Left over carried in'); }

  // ---------- scenarios ----------
  const SCN = [
    { ic: '💷', t: 'Payday lands', s: 'Start a new month. What was spare comes with you.', go: () => newMonth(), at: '#stcard' },
    { ic: '🛒', t: 'Big Tesco shop', s: 'Add £85.40 at Tesco, in Food shopping.', go: () => S.spends.unshift({ id: ++S.nid, n: 'Tesco', a: 85.40, cat: 'Food shopping', when: '6 Nov 2024' }), at: '#card-spend', open: 'spend' },
    { ic: '🏠', t: 'Rent goes up £20', s: 'The landlord puts rent up from next month.', go: () => { const r = S.bills.find(b => b.n === 'Rent'); if (r) r.a = +(r.a + 20).toFixed(2); }, at: '#card-bills', open: 'bills' },
    { ic: '⛽', t: 'Fuel pot runs over', s: 'A £120 fill-up on top of the £60 already spent.', go: () => S.spends.unshift({ id: ++S.nid, n: 'Shell', a: 120, cat: 'Fuel', when: '6 Nov 2024' }), at: '#card-pots', open: 'pots' },
    { ic: '💳', t: 'Pay off the credit card', s: 'Clear the £45 on the Zopa card.', go: () => { const u = compute().used; if (u > 0) S.card.unshift({ n: 'Paid off', a: -u, when: '6 Nov 2024' }); }, at: '#t-zopa', open: 'card' },
    { ic: '⏸', t: 'Pause Netflix', s: 'Take a month off. It stops counting.', go: () => { const b = S.bills.find(x => x.n === 'Netflix'); if (b) b.paused = true; }, at: '#card-bills', open: 'bills' },
  ];
  const done = new Map();
  function drawScn() {
    $('scn').innerHTML = SCN.map((s, i) => { const d = done.get(i);
      return `<button type="button" class="sc${d ? ' done' : ''}" data-si="${i}"><span class="ic">${d ? '✓' : s.ic}</span><b>${s.t}</b><small>${s.s}</small>
        ${d ? `<span class="res">${d.map(c => `<span class="chg ${c.cls}">${c.txt}</span>`).join('')}</span>` : ''}</button>`; }).join('');
    $('scn').querySelectorAll('.sc').forEach(b => b.onclick = () => runScn(+b.dataset.si));
  }
  // the thumb: scroll the phone with a thumb print pushing the glass
  const handW = window.Hand ? Hand.wrap($('phone')) : null;
  if (window.Hand) Hand.follow($('screen'), $('scroll'), handW);
  function thumbScroll(top) {
    const sc = $('scroll'), H = $('screen').clientHeight, dn = top > sc.scrollTop + 4, up = top < sc.scrollTop - 4;
    if ((dn || up) && window.Hand && !reduce) { Hand.press(handW, true); setTimeout(() => Hand.press(handW, false), 700);
      Hand.print($('screen'), { y0: dn ? H * .78 : H * .3, y1: dn ? H * .32 : H * .76, dur: 900, dx: dn ? -12 : 10 }); }
    setTimeout(() => sc.scrollTo({ top, behavior: reduce ? 'auto' : 'smooth' }), reduce ? 0 : 120);
  }
  if (!reduce) { setTimeout(() => thumbScroll(320), 1600); setTimeout(() => thumbScroll(0), 3600); }
  function flashPart(q) { const el = document.querySelector(q); if (!el) return; el.classList.remove('flashhl'); void el.offsetWidth; el.classList.add('flashhl'); }
  function runScn(i) {
    const s = SCN[i], before = compute();
    if (s.open) S.open[s.open] = true;
    closeMenu(); hideTip();
    s.go(); render();
    const after = compute(), chg = [];
    const push = (label, d, flip) => { if (Math.abs(d) < .005) return; chg.push({ cls: (d > 0) !== !!flip ? 'up' : 'down', txt: `${label} ${sgn(d)}` }); };
    if (i === 0) { chg.push({ cls: 'up', txt: 'Pay in ' + fmt(S.pay) }); push('Left carried', S.left); }
    else { push('Spare', after.actual - before.actual); push('Card free', after.free - before.free);
      if (after.potsOver > before.potsOver) chg.push({ cls: 'down', txt: 'Fuel over ' + fmt(after.potsOver) });
      if (Math.abs(after.actual - before.actual) < .005) chg.push({ cls: 'same', txt: 'Spare unchanged' }); }
    if (!chg.length) chg.push({ cls: 'same', txt: 'Nothing left to change' });
    done.set(i, chg); drawScn();
    setTimeout(() => { const el = document.querySelector(s.at); if (!el) return; const sc = $('scroll');
      thumbScroll(Math.max(el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 12, 0));
      flashPart(s.at); }, i === 0 ? (reduce ? 0 : 850) : 60);
    if (matchMedia('(max-width: 1099px)').matches) closeSheet();
  }

  // ---------- bottom sheet (narrow screens) ----------
  let curTab = null;
  function closeSheet() { document.body.classList.remove('sheet-open'); document.querySelectorAll('.sheettabs button').forEach(b => b.classList.remove('on')); curTab = null; }
  document.querySelectorAll('.sheettabs button').forEach(b => b.onclick = () => {
    if (curTab === b.dataset.tab) return closeSheet();
    curTab = b.dataset.tab;
    document.querySelectorAll('.rail').forEach(r => r.classList.toggle('cur', r.id === curTab));
    document.querySelectorAll('.sheettabs button').forEach(x => x.classList.toggle('on', x === b));
    document.body.classList.add('sheet-open');
  });

  // ---------- reset ----------
  $('reset').onclick = () => { S = START(); openLast.clear(); openCat.clear(); pausedOpen = false; done.clear(); found.clear();
    $('tipmode').checked = false; tipOn = false; hideTip(); closeMenu(); drawScn(); drawTipList(); render(); $('scroll').scrollTo({ top: 0 }); toast('Back to the start'); };

  drawScn(); drawTipList(); render();
})();
</script>
</body>
